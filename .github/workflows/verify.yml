name: Verify Bootfile

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'rebuild/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      STUDIO_CHECKOUT_ENABLED: 'false'
      STUDIO_FULFILLMENT_ENABLED: 'false'
      STUDIO_REFUNDS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check types
        run: npm run typecheck
      - name: Check lint
        run: npm run lint
      - name: Verify behavior and failure boundaries
        run: npm test
      - name: Build the production application
        run: npm run build
